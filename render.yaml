services:
  - type: web
    name: microbiology-lab-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually on Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
    healthCheckPath: /api/health
